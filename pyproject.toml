[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sampledoc"
dynamic = ["version"]
description = "Small, localized, byte-for-byte reproducible sample office documents (ODF, OOXML, PDF, CSV, TXT)."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Stefl" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["opendocument", "odf", "ooxml", "docx", "xlsx", "pptx", "pdf", "sample", "fixtures", "screenshots", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://opendocument.app/"
Source = "https://github.com/opendocument-app/sampledoc"
Issues = "https://github.com/opendocument-app/sampledoc/issues"
Changelog = "https://github.com/opendocument-app/sampledoc/blob/main/CHANGELOG.md"

[project.scripts]
sampledoc = "sampledoc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "src/sampledoc/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
